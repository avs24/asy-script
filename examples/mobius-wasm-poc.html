<!-- Paste this fragment into the Möbius question's HTML/source editor. -->
<figure data-mobius-asy>
  <div data-asy-output aria-live="polite">Loading Asymptote figure…</div>

  <script type="text/asymptote">
import geometry;
unitsize(0.5cm);
pair A = (0,0), B = (4,3), C = (4,0);

draw(A--B--C--cycle, blue+1bp);
markrightangle(B,C,A,red,PenMargins);
markangle("/(60^\circ \\)",C,A,B,radius=20,n=1,red,PenMargins);
dot(A^^B^^C, UnFill);
label("\( \sqrt{2} \)", (A+B)/2, NW);
label("A", A, SW);
label("B", B, NE);
label("C", C, SE);
  </script>
</figure>

<script type="module" src="https://cdn.jsdelivr.net/gh/avs24/asy-script@main/mobius-figure.js"></script>
